name: Deploy Production

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy-backend:
    name: Railway Backend
    runs-on: ubuntu-latest
    container: ghcr.io/railwayapp/cli:5.2.0
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: 0aa4acc1-343f-43bd-b0cd-54bf4ac9ea89
      RAILWAY_ENVIRONMENT_ID: 01523584-c526-4e2a-bc7c-d65f8c96e45b
      RAILWAY_SERVICE_ID: 4c6f0ed5-fa4d-4416-b3ce-9901f0127163
    steps:
      - uses: actions/checkout@v4
      - name: Deploy backend to Railway
        run: |
          railway up --ci \
            --project="$RAILWAY_PROJECT_ID" \
            --environment="$RAILWAY_ENVIRONMENT_ID" \
            --service="$RAILWAY_SERVICE_ID"

  deploy-frontend:
    name: Vercel Frontend
    runs-on: ubuntu-latest
    needs: deploy-backend
    env:
      VERCEL_ORG_ID: team_mi5Vnct6QcCM1QmFP3nPmMM2
      VERCEL_PROJECT_ID: prj_8RsjETRlzoIrM1DEwn1G8RkTXDOE
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production
      - name: Build frontend
        run: vercel build --prod
      - name: Deploy frontend
        run: vercel deploy --prebuilt --prod
