name: Deploy Production

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy-backend:
    name: Railway Backend
    runs-on: ubuntu-latest
    env:
      RAILWAY_ACCESS_TOKEN: ${{ secrets.RAILWAY_ACCESS_TOKEN }}
      RAILWAY_SERVICE_ID: 4c6f0ed5-fa4d-4416-b3ce-9901f0127163
      RAILWAY_ENVIRONMENT_ID: 01523584-c526-4e2a-bc7c-d65f8c96e45b
    steps:
      - name: Redeploy backend from GitHub (main)
        run: |
          response=$(curl -sS -X POST https://backboard.railway.com/graphql/v2 \
            -H "Authorization: Bearer $RAILWAY_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"query\":\"mutation { serviceInstanceRedeploy(serviceId: \\\"$RAILWAY_SERVICE_ID\\\", environmentId: \\\"$RAILWAY_ENVIRONMENT_ID\\\") }\"}")
          echo "$response"
          echo "$response" | grep -q '"serviceInstanceRedeploy":true' || exit 1

  deploy-frontend:
    name: Vercel Frontend
    runs-on: ubuntu-latest
    needs: deploy-backend
    env:
      VERCEL_ORG_ID: team_mi5Vnct6QcCM1QmFP3nPmMM2
      VERCEL_PROJECT_ID: prj_8RsjETRlzoIrM1DEwn1G8RkTXDOE
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production
      - name: Build frontend
        run: vercel build --prod
      - name: Deploy frontend
        run: vercel deploy --prebuilt --prod
