<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BEFORE mobile nav</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #f9fafb; }
    header { background: #fff; box-shadow: 0 4px 12px rgba(0,0,0,.12); padding: 16px; }
    h1 { color: #be123c; font-size: 20px; margin: 0 0 8px; }
    .welcome { font-size: 14px; color: #4b5563; }
    nav { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
    nav span { background: #f3f4f6; padding: 12px; border-radius: 8px; font-size: 14px; color: #374151; }
    nav .on { background: #ffe4e6; color: #be123c; }
    .row { display: flex; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px solid #e5e7eb; }
    .row button { flex: 1; min-height: 40px; }
  </style>
</head>
<body>
  <header>
    <h1>BLD Cebu Community Online Portal</h1>
    <p class="welcome">Welcome, Mai Santos!</p>
    <nav>
      <span>Home</span><span class="on">Check-in</span>
      <span>Members</span><span>Events</span>
      <span>Registrations</span><span>Reports</span>
      <span>Profile</span>
    </nav>
    <div class="row">
      <button>Profile</button>
      <button style="background:#dc2626;color:#fff;border:0;border-radius:8px;">Sign Out</button>
    </div>
  </header>
</body>
</html>
