<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BEFORE member self check-in</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #f3f4f6; }
    header { background: #fff; box-shadow: 0 4px 12px rgba(0,0,0,.12); padding: 16px; }
    h1 { color: #be123c; font-size: 20px; margin: 0; }
    main { padding: 16px; max-width: 36rem; margin: 0 auto; }
    .title { font-size: 30px; font-weight: 700; }
    .sub { color: #4b5563; font-size: 18px; }
    .card { background: #fff; border: 2px solid #e5e7eb; border-radius: 12px; padding: 24px; margin-top: 16px; text-align: center; }
    .event { font-size: 20px; font-weight: 600; }
    .when { color: #4b5563; }
    .cta { width: 100%; min-height: 72px; background: #16a34a; color: #fff; border: 2px solid #15803d; border-radius: 12px; font-size: 20px; margin-top: 16px; }
    .ghost { width: 100%; min-height: 48px; margin-top: 16px; background: #fff; border: 0; font-size: 16px; color: #374151; }
    .outline { width: 100%; min-height: 52px; margin-top: 8px; border: 2px solid #d1d5db; background: #fff; border-radius: 8px; font-size: 16px; }
  </style>
</head>
<body>
  <header><h1>BLD Cebu Community Online Portal</h1></header>
  <main>
    <p class="title">Self Check-In</p>
    <p class="sub">Tap the green button to check in for today's event.</p>
    <div class="card">
      <p class="event">Community Worship</p>
      <p class="when">Sep 22, 2026 at 7:00 PM</p>
      <button class="cta">Check In</button>
      <button class="ghost">Need a different event?</button>
      <button class="outline">Scan QR code instead</button>
      <button class="outline">Get help</button>
    </div>
  </main>
</body>
</html>
